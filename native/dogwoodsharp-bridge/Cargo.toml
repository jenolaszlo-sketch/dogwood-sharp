[package]
name = "dogwoodsharp-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dogwood-language = { git = "https://github.com/dogwood-policy/dogwood", rev = "929f49e7305534ac61ef06cf8e47269c596dc851", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"
