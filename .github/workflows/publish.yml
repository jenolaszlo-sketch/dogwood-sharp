name: Exact-artifact NuGet publication

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Approved release-candidate commit
        required: true
        type: string
      source_run_id:
        description: Approved source CI run ID
        required: true
        type: string
      source_run_attempt:
        description: Approved source CI run attempt
        required: true
        default: '1'
        type: string
      owner_authorization_id:
        description: Owner authorization record ID
        required: true
        type: string
      dry_run:
        description: Build and verify the publication plan without credentials or upload
        required: true
        default: true
        type: boolean
      publication_environment:
        description: Protected publication environment
        required: true
        default: nuget-publication
        type: string
      destination:
        description: Approved NuGet v3 destination
        required: true
        default: https://api.nuget.org/v3/index.json
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dogwoodsharp-nuget-publication
  cancel-in-progress: false

env:
  RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
  OWNER_AUTHORIZATION_ID: ${{ inputs.owner_authorization_id }}
  DRY_RUN: ${{ inputs.dry_run }}
  PUBLICATION_ENVIRONMENT: ${{ inputs.publication_environment }}
  DESTINATION: ${{ inputs.destination }}

jobs:
  verify:
    name: Verify exact publication plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout at the invoked revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate workflow inputs as inert data
        shell: pwsh
        run: ./scripts/publication/Test-PublicationInputs.ps1

      - name: Test workflow input handling
        shell: pwsh
        run: ./scripts/publication/Test-WorkflowInputSafety.ps1 -WorkflowPath .github/workflows/publish.yml -RepositoryRoot "$PWD"

      - name: Require canonical main ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing publication: invocation ref is $GITHUB_REF, not refs/heads/main." >&2
            exit 1
          fi

      - name: Verify publication workflow revision lock
        shell: pwsh
        run: |
          ./scripts/publication/Test-WorkflowLock.ps1 `
            -LockPath docs/reviews/dogwood-sharp-pub-prep-01/publication-workflow.lock.json `
            -RepositoryRoot "$PWD"

      - name: Require NUGET_USER for live publication
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo 'NUGET_USER is not configured; live publication is refused.' >&2
            exit 1
          fi

      - name: Fetch source run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts/publication
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > artifacts/publication/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" > artifacts/publication/source-artifacts.json
          pwsh -NoProfile -Command '
            $run = Get-Content -Raw artifacts/publication/source-run.json | ConvertFrom-Json
            $arts = Get-Content -Raw artifacts/publication/source-artifacts.json | ConvertFrom-Json
            @{ run = $run; artifacts = @($arts.artifacts) } |
              ConvertTo-Json -Depth 20 |
              Set-Content -Encoding utf8NoBOM artifacts/publication/source-metadata.json
          '

      - name: Download exact source artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dogwoodsharp-d3-candidates
          path: artifacts/publication/source
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Select authorization record
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "AUTH_PATH=docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-DRY-RUN.json" >> "$GITHUB_ENV"
          else
            echo "AUTH_PATH=docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json" >> "$GITHUB_ENV"
          fi

      - name: Verify exact publication plan
        shell: pwsh
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          ./scripts/publication/Test-PublicationPlan.ps1 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -ArtifactDirectory artifacts/publication/source `
            -SourceMetadataPath artifacts/publication/source-metadata.json `
            -AuthorizationPath "$env:AUTH_PATH" `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Ref "$env:GITHUB_REF" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -DryRun:$dryRun `
            -PlanPath artifacts/publication/publication-plan.json `
            -RepositoryRoot "$PWD" `
            -ConcurrencyLockPath artifacts/publication/publication.lock `
            -WorkflowLockPath docs/reviews/dogwood-sharp-pub-prep-01/publication-workflow.lock.json

      - name: Upload publication plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-plan
          path: |
            artifacts/publication/publication-plan.json
            artifacts/publication/source-metadata.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish exact authorized artifacts
    needs: verify
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: nuget-publication
      url: https://www.nuget.org/packages/DogwoodSharp/0.1.0-preview.1
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout at the invoked revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate workflow inputs as inert data
        shell: pwsh
        run: ./scripts/publication/Test-PublicationInputs.ps1

      - name: Test workflow input handling
        shell: pwsh
        run: ./scripts/publication/Test-WorkflowInputSafety.ps1 -WorkflowPath .github/workflows/publish.yml -RepositoryRoot "$PWD"

      - name: Setup .NET SDK for exact-artifact push
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.404

      - name: Verify publication workflow revision lock
        shell: pwsh
        run: |
          ./scripts/publication/Test-WorkflowLock.ps1 `
            -LockPath docs/reviews/dogwood-sharp-pub-prep-01/publication-workflow.lock.json `
            -RepositoryRoot "$PWD"

      - name: Require NUGET_USER for live publication
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo 'NUGET_USER is not configured; live publication is refused.' >&2
            exit 1
          fi

      - name: Fetch source run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts/publication
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > artifacts/publication/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" > artifacts/publication/source-artifacts.json
          pwsh -NoProfile -Command '
            $run = Get-Content -Raw artifacts/publication/source-run.json | ConvertFrom-Json
            $arts = Get-Content -Raw artifacts/publication/source-artifacts.json | ConvertFrom-Json
            @{ run = $run; artifacts = @($arts.artifacts) } |
              ConvertTo-Json -Depth 20 |
              Set-Content -Encoding utf8NoBOM artifacts/publication/source-metadata.json
          '

      - name: Download exact source artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dogwoodsharp-d3-candidates
          path: artifacts/publication/source
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download verified publication plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: publication-plan
          path: artifacts/publication/verified

      - name: Re-verify exact publication plan before credentials
        shell: pwsh
        run: |
          ./scripts/publication/Test-PublicationPlan.ps1 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -ArtifactDirectory artifacts/publication/source `
            -SourceMetadataPath artifacts/publication/source-metadata.json `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Ref "$env:GITHUB_REF" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -RepositoryRoot "$PWD" `
            -ConcurrencyLockPath artifacts/publication/publication.lock `
            -WorkflowLockPath docs/reviews/dogwood-sharp-pub-prep-01/publication-workflow.lock.json

      - name: Cross-check the verified and live publication plans
        shell: pwsh
        run: |
          ./scripts/publication/Compare-PublicationPlans.ps1 `
            -VerifiedPlan artifacts/publication/verified/publication-plan.json `
            -LivePlan artifacts/publication/publication-plan.live.json

      - name: Initialize durable publication journal before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/publication/Initialize-PublicationJournal.ps1 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -JournalRepository "$env:GITHUB_REPOSITORY" `
            -JournalBranch publication-state `
            -JournalGitHubPath publication-state/journal.jsonl `
            -JournalRefBaseSha "$env:GITHUB_SHA"

      - name: Authenticate to NuGet with GitHub OIDC
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish operation 1 - DogwoodSharp package
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/publication/Invoke-PublicationOperation.ps1 `
            -Order 1 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -ArtifactDirectory artifacts/publication/source `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -JournalRepository "$env:GITHUB_REPOSITORY" `
            -JournalBranch publication-state `
            -JournalGitHubPath publication-state/journal.jsonl `
            -JournalRefBaseSha "$env:GITHUB_SHA" `
            -RequireRepositorySignature

      - name: Publish operation 2 - DogwoodSharp symbol package
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/publication/Invoke-PublicationOperation.ps1 `
            -Order 2 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -ArtifactDirectory artifacts/publication/source `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -JournalRepository "$env:GITHUB_REPOSITORY" `
            -JournalBranch publication-state `
            -JournalGitHubPath publication-state/journal.jsonl `
            -JournalRefBaseSha "$env:GITHUB_SHA" `
            -RequireRepositorySignature

      - name: Publish operation 3 - DogwoodSharp.CedarSharp package
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/publication/Invoke-PublicationOperation.ps1 `
            -Order 3 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -ArtifactDirectory artifacts/publication/source `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -JournalRepository "$env:GITHUB_REPOSITORY" `
            -JournalBranch publication-state `
            -JournalGitHubPath publication-state/journal.jsonl `
            -JournalRefBaseSha "$env:GITHUB_SHA" `
            -RequireRepositorySignature

      - name: Publish operation 4 - DogwoodSharp.CedarSharp symbol package
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/publication/Invoke-PublicationOperation.ps1 `
            -Order 4 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -ArtifactDirectory artifacts/publication/source `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -SourceRunId "$env:SOURCE_RUN_ID" `
            -SourceRunAttempt "$env:SOURCE_RUN_ATTEMPT" `
            -Environment "$env:PUBLICATION_ENVIRONMENT" `
            -Destination "$env:DESTINATION" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -JournalRepository "$env:GITHUB_REPOSITORY" `
            -JournalBranch publication-state `
            -JournalGitHubPath publication-state/journal.jsonl `
            -JournalRefBaseSha "$env:GITHUB_SHA" `
            -RequireRepositorySignature

      - name: Require the complete four-operation publication state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/publication/Test-PublicationCompletion.ps1 `
            -InventoryPath docs/reviews/dogwood-sharp-pub-prep-01/publication-inventory.json `
            -AuthorizationPath docs/reviews/dogwood-sharp-pub-prep-01/OWNER-AUTHORIZATION-PUBLICATION.json `
            -PlanPath artifacts/publication/publication-plan.live.json `
            -ReleaseCandidate "$env:RELEASE_CANDIDATE" `
            -OwnerAuthorizationId "$env:OWNER_AUTHORIZATION_ID" `
            -JournalRepository "$env:GITHUB_REPOSITORY" `
            -JournalBranch publication-state `
            -JournalGitHubPath publication-state/journal.jsonl `
            -JournalRefBaseSha "$env:GITHUB_SHA"
