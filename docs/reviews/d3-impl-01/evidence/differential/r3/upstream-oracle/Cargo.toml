[package]
name = "dogwoodsharp-upstream-oracle"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# DOGWOOD-SHARP-D3-IMPL-01-R3 upstream differential oracle.
#
# This harness links the actual pinned upstream dogwood-language authorizer and
# executes the production Dogwood/Event/is_authorized path, including the
# schema-aware validation phase (`dogwood validate`) that the pinned upstream
# CLI and the D2 lowering pipeline both run. It is evidence tooling only; it is
# not a production execution path and is not shipped.

[dependencies]
dogwood-language = { git = "https://github.com/dogwood-policy/dogwood", rev = "929f49e7305534ac61ef06cf8e47269c596dc851", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
