name: D3 R5-R3 Cross-Platform Differential Execution

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform(s) to execute
        type: choice
        options: [all, linux-x64, osx-arm64]
        default: all
      tfm:
        description: Target framework(s)
        type: choice
        options: [all, net8.0, net10.0]
        default: all

permissions:
  contents: read

jobs:
  differential:
    name: Differential ${{ matrix.rid }} / ${{ matrix.tfm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: osx-arm64
            os: macos-15
        tfm:
          - net8.0
          - net10.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      R5R3_TREE: 71d5beda425b2c9bc45a602868abaabd03f606f5
      PATCHED_API_SHA256: 4ff2eb118a08c13eddf1d54ea1cf178db70f1a148bacb6e377333abeb5b67dd3
      PATCH_FILE: docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/dogwood-typed-context.patch
      PATCH_SHA256: 76714faa4cbbc12866565736f1a6d7b8d4ef02ca53bd90c111eb035a3ee46b32
      DOGWOOD_PINNED_REV: 929f49e7305534ac61ef06cf8e47269c596dc851

    steps:
      - name: Checkout repository at exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify baseline commit and tree
        shell: pwsh
        run: |
          $actualCommit = git rev-parse HEAD
          if ($actualCommit -ne "${{ github.sha }}") {
            throw "Checkout commit mismatch: expected ${{ github.sha }}, got $actualCommit"
          }
          $actualTree = git rev-parse HEAD^{tree}
          if ($actualTree -ne "${{ env.R5R3_TREE }}") {
            throw "Baseline tree mismatch: expected ${{ env.R5R3_TREE }}, got $actualTree"
          }
          Write-Host "Baseline verified: ${{ github.sha }} / ${{ env.R5R3_TREE }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.428
            10.0.404

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache: false

      - name: Install system dependencies (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            pkg-config \
            python3 \
            python3-pip

      - name: Install system dependencies (macOS)
        if: matrix.rid == 'osx-arm64'
        run: |
          brew install llvm pkg-config python3

      - name: Prepare MSVC (Windows)
        if: matrix.rid == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate or fetch pinned Dogwood checkout
        id: dogwood
        shell: pwsh
        run: |
          $rev = "${{ env.DOGWOOD_PINNED_REV }}"
          $cacheDir = "$env:USERPROFILE/.cargo/git/checkouts"
          
          # Try to find in Cargo cache
          $found = Get-ChildItem "$cacheDir/dogwood-*" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Directory | Where-Object {
              & git -C $_.FullName rev-parse HEAD 2>$null
              if ($LASTEXITCODE -eq 0 -and (git -C $_.FullName rev-parse HEAD).Trim() -eq $rev) {
                $_.FullName
              }
            }
          } | Select-Object -First 1
          
          if ($found) {
            Write-Host "Found pinned Dogwood at $found"
            echo "path=$found" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Pinned Dogwood not in cache, will fetch via cargo vendor"
            echo "path=" >> $env:GITHUB_OUTPUT
          }

      - name: Fetch Dogwood source if not cached
        if: steps.dogwood.outputs.path == ''
        shell: pwsh
        run: |
          $vendorDir = "vendor/dogwood-pinned"
          if (-not (Test-Path $vendorDir)) {
            mkdir $vendorDir | Out-Null
            cargo vendor --manifest-path native/dogwoodsharp-bridge/Cargo.toml --versioned-dirs $vendorDir 2>&1 | Out-Null
          }
          # Find the dogwood-language directory
          $dogwoodLang = Get-ChildItem "$vendorDir/dogwood-language-*" -Directory | Select-Object -First 1
          if ($dogwoodLang) {
            echo "path=$($dogwoodLang.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            throw "Could not find dogwood-language in vendor directory"
          }

      - name: Apply reference patch and verify
        id: patch
        shell: pwsh
        run: |
          $source = "${{ steps.dogwood.outputs.path }}"
          $patchFile = "${{ env.PATCH_FILE }}"
          $expectedApiSha = "${{ env.PATCHED_API_SHA256 }}"
          $workDir = "r5r3-work/dogwood-patched"
          
          if (-not (Test-Path $source)) {
            throw "Dogwood source not found at $source"
          }
          
          # Clean and copy
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          mkdir $workDir | Out-Null
          robocopy $source $workDir /E /NFL /NDL /NJH /NJS /NP /XD target .git | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Failed to copy Dogwood tree" }
          
          # Apply patch
          & git -C $workDir -c core.autocrlf=false -c core.eol=lf apply -p1 --whitespace=nowarn $patchFile
          if ($LASTEXITCODE -ne 0) { throw "Patch did not apply cleanly" }
          
          # Verify patched api.rs
          $apiPath = Join-Path $workDir "dogwood-language/src/api.rs"
          $actual = (Get-FileHash $apiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expectedApiSha) {
            throw "Patched api.rs SHA mismatch: got $actual, expected $expectedApiSha"
          }
          
          # Verify only one file changed
          $sourceFiles = Get-ChildItem $source -Recurse -File | Where-Object { $_.FullName -notmatch '\\target\\|\\.git' }
          $different = @()
          foreach ($file in $sourceFiles) {
            $rel = $file.FullName.Substring($source.Length + 1) -replace '\\', '/'
            $patched = Join-Path $workDir $rel
            if (-not (Test-Path $patched)) { $different += "$rel (missing)"; continue }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $patched -Algorithm SHA256).Hash) {
              $different += $rel
            }
          }
          if ($different.Count -ne 1 -or $different[0] -ne 'dogwood-language/src/api.rs') {
            throw "Unexpected files changed: $($different -join '; ')"
          }
          
          Write-Host "Patch verified: only dogwood-language/src/api.rs changed, api.rs SHA256 $actual"
          echo "patched_root=$workDir" >> $env:GITHUB_OUTPUT

      - name: Build corrected reference oracle
        id: oracle
        shell: pwsh
        run: |
          $patchedRoot = "${{ steps.patch.outputs.patched_root }}"
          $staging = "r5r3-work/corrected-oracle"
          
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          mkdir $staging/src -Force | Out-Null
          
          # Copy oracle source
          Copy-Item "docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/src" $staging -Recurse -Force
          
          # Generate Cargo.toml with patched dependency path
          $template = Get-Content "docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/Cargo.toml.template" -Raw
          $manifest = $template -replace '__DOGWOOD_PATCHED_PATH__', (Resolve-Path (Join-Path $patchedRoot "dogwood-language")).Path -replace '\\', '/'
          [IO.File]::WriteAllText((Join-Path $staging "Cargo.toml"), $manifest, [Text.UTF8Encoding]::new($false))
          
          # Copy locked Cargo.lock
          Copy-Item "docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/Cargo.lock" $staging -Force
          
          # Build
          $env:CARGO_TARGET_DIR = "r5r3-work/oracle-target"
          cargo build --locked --release --offline --manifest-path (Join-Path $staging "Cargo.toml")
          
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $oracleExe = "r5r3-work/oracle-target/release/dogwoodsharp-corrected-oracle$suffix"
          if (-not (Test-Path $oracleExe)) { throw "Oracle executable not found at $oracleExe" }
          
          $oracleSha = (Get-FileHash $oracleExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Oracle built: $oracleExe (SHA256: $oracleSha)"
          echo "path=$oracleExe" >> $env:GITHUB_OUTPUT
          echo "sha256=$oracleSha" >> $env:GITHUB_OUTPUT

      - name: Build Cedar adjudicator (4.13.0)
        id: adjudicator
        shell: pwsh
        run: |
          $staging = "r5r3-work/cedar-adjudicator"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          mkdir $staging -Force | Out-Null
          
          Copy-Item "docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/src" $staging -Recurse -Force
          Copy-Item "docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/Cargo.toml" $staging
          Copy-Item "docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/Cargo.lock" $staging
          
          $env:CARGO_TARGET_DIR = "r5r3-work/adjudicator-target"
          cargo build --locked --release --offline --manifest-path (Join-Path $staging "Cargo.toml")
          
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $exe = "r5r3-work/adjudicator-target/release/cedar-adjudicator$suffix"
          if (-not (Test-Path $exe)) { throw "Adjudicator not found at $exe" }
          
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Cedar adjudicator built: $exe (SHA256: $sha)"
          echo "path=$exe" >> $env:GITHUB_OUTPUT
          echo "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Build D2 bridge (native)
        id: bridge
        shell: pwsh
        run: |
          $bridgeDir = "native/dogwoodsharp-bridge"
          $targetArg = if ("${{ matrix.rid }}" -eq "linux-x64") { "--target x86_64-unknown-linux-gnu" }
                        elseif ("${{ matrix.rid }}" -eq "osx-arm64") { "--target aarch64-apple-darwin" }
                        else { "" }
          
          $env:CARGO_TARGET_DIR = "r5r3-work/bridge-target"
          cargo build --locked --release $targetArg --manifest-path (Join-Path $bridgeDir "Cargo.toml")
          
          $libName = if ("${{ matrix.rid }}" -eq "linux-x64") { "libdogwoodsharp_bridge.so" }
                      elseif ("${{ matrix.rid }}" -eq "osx-arm64") { "libdogwoodsharp_bridge.dylib" }
                      else { "dogwoodsharp_bridge.dll" }
          $libPath = "r5r3-work/bridge-target/${{ matrix.rid }}/release/$libName"
          if (-not (Test-Path $libPath)) {
            # Try without RID in path
            $libPath = "r5r3-work/bridge-target/release/$libName"
          }
          if (-not (Test-Path $libPath)) { throw "Bridge library not found at $libPath" }
          
          $sha = (Get-FileHash $libPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "D2 bridge built: $libPath (SHA256: $sha)"
          echo "path=$libPath" >> $env:GITHUB_OUTPUT
          echo "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Build CedarSharp native
        id: cedarsharp
        shell: pwsh
        run: |
          # CedarSharp is a separate repo; we need to build it from source
          # For now, use the published NuGet package's native assets
          # In a full qualification, we'd build from the CedarSharp source at the pinned revision
          $csDir = "cedar-sharp/native"
          if (-not (Test-Path $csDir)) {
            Write-Host "CedarSharp source not found locally, will use NuGet package native assets"
            # The probe restore will fetch the CedarSharp package with native assets
            echo "path=" >> $env:GITHUB_OUTPUT
            echo "sha256=" >> $env:GITHUB_OUTPUT
          } else {
            $targetArg = if ("${{ matrix.rid }}" -eq "linux-x64") { "--target x86_64-unknown-linux-gnu" }
                          elseif ("${{ matrix.rid }}" -eq "osx-arm64") { "--target aarch64-apple-darwin" }
                          else { "" }
            $env:CARGO_TARGET_DIR = "r5r3-work/cedarsharp-target"
            cargo build --locked --release $targetArg --manifest-path (Join-Path $csDir "Cargo.toml")
            
            $libName = if ("${{ matrix.rid }}" -eq "linux-x64") { "libcedarsharp_native.so" }
                        elseif ("${{ matrix.rid }}" -eq "osx-arm64") { "libcedarsharp_native.dylib" }
                        else { "cedarsharp_native.dll" }
            $libPath = "r5r3-work/cedarsharp-target/${{ matrix.rid }}/release/$libName"
            if (-not (Test-Path $libPath)) {
              $libPath = "r5r3-work/cedarsharp-target/release/$libName"
            }
            if (-not (Test-Path $libPath)) { throw "CedarSharp native not found at $libPath" }
            
            $sha = (Get-FileHash $libPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "CedarSharp native built: $libPath (SHA256: $sha)"
            echo "path=$libPath" >> $env:GITHUB_OUTPUT
            echo "sha256=$sha" >> $env:GITHUB_OUTPUT
          }

      - name: Stage native assets for probe
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $tfm = "${{ matrix.tfm }}"
          $probeRuntime = "docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/$tfm/runtimes/$rid/native"
          mkdir $probeRuntime -Force | Out-Null
          
          # D2 bridge
          if ("${{ steps.bridge.outputs.path }}") {
            $dest = Join-Path $probeRuntime (if ($IsWindows) { "dogwoodsharp_bridge.dll" } else { "libdogwoodsharp_bridge.so" })
            Copy-Item "${{ steps.bridge.outputs.path }}" $dest -Force
            Write-Host "Staged D2 bridge to $dest"
          }
          
          # CedarSharp native
          if ("${{ steps.cedarsharp.outputs.path }}") {
            $dest = Join-Path $probeRuntime (if ($IsWindows) { "cedarsharp_native.dll" } else { "libcedarsharp_native.so" })
            Copy-Item "${{ steps.cedarsharp.outputs.path }}" $dest -Force
            Write-Host "Staged CedarSharp native to $dest"
          }
          
          # Create native manifest files
          $bridgeSha = "${{ steps.bridge.outputs.sha256 }}"
          $csSha = "${{ steps.cedarsharp.outputs.sha256 }}"
          
          @{
            file = if ($IsWindows) { "dogwoodsharp_bridge.dll" } else { "libdogwoodsharp_bridge.so" }
            sha256 = $bridgeSha
            cargoLockSha256 = (Get-FileHash "native/dogwoodsharp-bridge/Cargo.lock" -Algorithm SHA256).Hash.ToLowerInvariant()
            target = "${{ matrix.rid }}"
            abiVersion = 1
            dogwoodVersion = "1.1.2"
            dogwoodRevision = "${{ env.DOGWOOD_PINNED_REV }}"
            cedarVersion = "4.11.0"
            rustVersion = "1.99.1"
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $probeRuntime "dogwoodsharp-native.json") -Encoding utf8
          
          if ($csSha) {
            @{
              file = if ($IsWindows) { "cedarsharp_native.dll" } else { "libcedarsharp_native.so" }
              sha256 = $csSha
              target = "${{ matrix.rid }}"
            } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $probeRuntime "cedarsharp-native.json") -Encoding utf8
          }

      - name: Build probe
        shell: pwsh
        run: |
          $probeProj = "docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/R5R1Probe.csproj"
          dotnet restore "$probeProj" --locked-mode
          dotnet build "$probeProj" -c Release -f ${{ matrix.tfm }} --no-restore
          
          $probeDll = "docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/${{ matrix.tfm }}/PrepProbe.dll"
          if (-not (Test-Path $probeDll)) { throw "Probe not built at $probeDll" }
          Write-Host "Probe built: $probeDll"

      - name: Run differential (corrected reference)
        id: diff
        shell: pwsh
        run: |
          $probe = "docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/${{ matrix.tfm }}/PrepProbe.dll"
          $oracle = "${{ steps.oracle.outputs.path }}"
          $fixtures = "docs/reviews/d3-impl-01-r5-r2/evidence/fixtures.json"
          $register = "docs/reviews/d3-impl-01-r5-r2/evidence/register-corrected-reference.json"
          $outDir = "artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          mkdir $outDir -Force | Out-Null
          $obs = Join-Path $outDir "observations-corrected-reference.json"
          $life = Join-Path $outDir "lifecycle-corrected-reference.json"
          $scratch = "r5r3-work/scratch-${{ matrix.rid }}-${{ matrix.tfm }}"
          
          dotnet $probe differential $fixtures $oracle $register $obs $life $scratch 2>&1 |
            Tee-Object -FilePath (Join-Path $outDir "console.log")
          $exitCode = $LASTEXITCODE
          
          if ($exitCode -ne 0) {
            Write-Host "Differential exited with code $exitCode"
            $result = Get-Content $obs -Raw | ConvertFrom-Json
            Write-Host "Summary: $($result.summary | ConvertTo-Json -Compress)"
            if ($result.coverageErrors) {
              Write-Host "Coverage errors: $($result.coverageErrors -join '; ')"
            }
            foreach ($c in $result.cases) {
              if ($c.verdict -ne 'pass') {
                Write-Host "FAIL: $($c.id) class=$($c.classification) fields=$($c.observedDifferenceFields.field -join ',')"
              }
            }
            throw "Differential failed on ${{ matrix.rid }}/${{ matrix.tfm }}"
          }
          
          $result = Get-Content $obs -Raw | ConvertFrom-Json
          Write-Host "Differential passed: $($result.summary.passed)/$($result.summary.total) cases"
          echo "observations=$obs" >> $env:GITHUB_OUTPUT
          echo "lifecycle=$life" >> $env:GITHUB_OUTPUT

      - name: Run harness self-test
        shell: pwsh
        run: |
          $probe = "docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/${{ matrix.tfm }}/PrepProbe.dll"
          $oracle = "docs/reviews/d3-impl-01/evidence/differential/r4/upstream-oracle/target/release/dogwoodsharp-upstream-oracle.exe"
          if (-not (Test-Path $oracle)) {
            Write-Host "Original oracle not available on non-Windows, skipping self-test"
            exit 0
          }
          $outDir = "artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          $selfTest = Join-Path $outDir "self-test.json"
          dotnet $probe self-test $oracle $selfTest 2>&1 | Tee-Object -FilePath (Join-Path $outDir "self-test.log")
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed" }
          Write-Host "Self-test passed"

      - name: Run Cedar adjudicator verification
        shell: pwsh
        run: |
          $adj = "${{ steps.adjudicator.outputs.path }}"
          $corpus = "docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/corpus.json"
          $outDir = "artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          $outcome = Join-Path $outDir "adjudicator-outcome.json"
          & $adj $corpus $outcome
          if ($LASTEXITCODE -ne 0) { throw "Cedar adjudicator failed" }
          Write-Host "Cedar adjudicator verification passed"

      - name: Upload differential evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r5r3-differential-${{ matrix.rid }}-${{ matrix.tfm }}
          path: |
            artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}/*.json
            artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}/*.log
          retention-days: 30

      - name: Verify differential results
        shell: pwsh
        run: |
          $outDir = "artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          $obs = Join-Path $outDir "observations-corrected-reference.json"
          $result = Get-Content $obs -Raw | ConvertFrom-Json
          
          Write-Host "=== ${{ matrix.rid }} / ${{ matrix.tfm }} ==="
          Write-Host "Total: $($result.summary.total)"
          Write-Host "Passed: $($result.summary.passed)"
          Write-Host "Failed: $($result.summary.failed)"
          Write-Host "Pending: $($result.summary.pending)"
          
          if ($result.summary.failed -gt 0) {
            Write-Host "FAILURES:"
            foreach ($c in $result.cases) {
              if ($c.verdict -ne 'pass') {
                Write-Host "  $($c.id): $($c.classification) fields=$($c.observedDifferenceFields.field -join ',')"
              }
            }
            throw "Differential has $($result.summary.failed) failures on ${{ matrix.rid }}/${{ matrix.tfm }}"
          }
          
          if ($result.coverageErrors) {
            Write-Host "Coverage errors: $($result.coverageErrors -join '; ')"
            throw "Coverage errors present"
          }
          
          Write-Host "ALL CASES PASSED on ${{ matrix.rid }}/${{ matrix.tfm }}"