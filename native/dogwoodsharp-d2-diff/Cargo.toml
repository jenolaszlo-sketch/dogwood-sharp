[package]
name = "dogwoodsharp-d2-diff"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Independent D2 differential harness. It derives expectations by calling the
# pinned upstream Dogwood crate directly, then compares them against the native
# bridge through its exported C ABI and against the pinned fixture manifest.

[dependencies]
dogwood-language = { git = "https://github.com/dogwood-policy/dogwood", rev = "929f49e7305534ac61ef06cf8e47269c596dc851", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"