name: D2 independent qualification
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Run the full matrix or Linux ownership follow-up
        type: choice
        options: [all, linux-x64]
        default: all
permissions:
  contents: read
jobs:
  qualify:
    name: Qualify ${{ matrix.rid }} on .NET 8 and .NET 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'linux-x64' && '{"include":[{"os":"ubuntu-24.04","rid":"linux-x64"}]}' || '{"include":[{"os":"windows-2025","rid":"win-x64"},{"os":"ubuntu-24.04","rid":"linux-x64"},{"os":"macos-15","rid":"osx-arm64"}]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.428
            10.0.404
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache: false
      - name: Install Linux memory checker
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Prepare MSVC for the C consumer
        if: matrix.rid == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Reproduce regressions and run qualification consumers
        shell: pwsh
        run: ./docs/reviews/d2-qualification/run.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogwood-d2-qual-${{ matrix.rid }}
          path: |
            artifacts/d2-qualification/${{ matrix.rid }}/*.log
            artifacts/d2-qualification/${{ matrix.rid }}/*.json
            artifacts/d2-r1-d1-regression/reports
            artifacts/d2-r1-d1-regression/logs/native-selftest.log
            artifacts/test-results/*.trx
            artifacts/native/runtimes/*/native/dogwoodsharp-native.json
