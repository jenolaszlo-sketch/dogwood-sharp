name: D3 R5-R3 Cross-Platform Differential Execution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform(s) to execute
        type: choice
        options: [all, linux-x64, osx-arm64]
        default: all
      tfm:
        description: Target framework(s)
        type: choice
        options: [all, net8.0, net10.0]
        default: all

permissions:
  contents: read

jobs:
  differential:
    name: Differential ${{ matrix.rid }} / ${{ matrix.tfm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: osx-arm64
            os: macos-15
        tfm:
          - net8.0
          - net10.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DOGWOOD_PINNED_REV: 929f49e7305534ac61ef06cf8e47269c596dc851

    steps:
      - name: Checkout repository at exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify baseline commit and tree
        shell: bash
        run: |
          actualCommit=$(git rev-parse HEAD)
          if [ "$actualCommit" != "${{ github.sha }}" ]; then
            echo "Checkout commit mismatch: expected ${{ github.sha }}, got $actualCommit"
            exit 1
          fi
          actualTree=$(git rev-parse HEAD^{tree})
          echo "Baseline verified: $actualCommit / $actualTree"
          echo "R5R3_ACTUAL_TREE=$actualTree" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.428
            10.0.404

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache: false

      - name: Install system dependencies (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config python3 python3-pip

      - name: Install system dependencies (macOS)
        if: matrix.rid == 'osx-arm64'
        run: brew install llvm pkg-config python3

      - name: Prepare MSVC (Windows)
        if: matrix.rid == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch pinned Dogwood source
        id: dogwood
        shell: bash
        run: |
          rev="${{ env.DOGWOOD_PINNED_REV }}"
          cloneDir="r5r3-work/dogwood-pinned-source"
          if [ -d "$cloneDir" ]; then rm -rf "$cloneDir"; fi
          mkdir -p "$cloneDir"
          git clone https://github.com/dogwood-policy/dogwood.git "$cloneDir"
          if [ $? -ne 0 ]; then echo "Failed to clone Dogwood repo"; exit 1; fi
          git -C "$cloneDir" checkout "$rev"
          if [ $? -ne 0 ]; then echo "Failed to checkout Dogwood revision $rev"; exit 1; fi
          actual=$(git -C "$cloneDir" rev-parse HEAD | tr -d '\n')
          if [ "$actual" != "$rev" ]; then echo "Dogwood revision mismatch: expected $rev, got $actual"; exit 1; fi
          echo "Dogwood cloned and checked out at $rev"
          echo "path=$cloneDir" >> $GITHUB_OUTPUT

      - name: Apply reference patch manually
        id: patch
        shell: bash
        run: |
          source="${{ steps.dogwood.outputs.path }}"
          workDir="r5r3-work/dogwood-patched"
          if [ ! -d "$source" ]; then echo "Dogwood source not found at $source"; exit 1; fi
          if [ -d "$workDir" ]; then rm -rf "$workDir"; fi
          mkdir -p "$workDir"
          rsync -a --exclude=target --exclude=.git "$source/" "$workDir/"
          if [ $? -ne 0 ]; then echo "Failed to copy Dogwood tree"; exit 1; fi

          apiPath="$workDir/dogwood-language/src/api.rs"
          content=$(cat "$apiPath")

          # Find value_to_expr function
          insertMarker='fn value_to_expr(v: &Value) -> RestrictedExpression {'
          insertLine=$(echo "$content" | awk -v m="$insertMarker" 'index($0,m){print NR; exit}')
          if [ -z "$insertLine" ] || [ "$insertLine" = "0" ]; then echo "Could not find value_to_expr function in api.rs"; exit 1; fi
          
          # Calculate byte offset
          byteOffset=$(echo "$content" | head -n $((insertLine-1)) | wc -c)

          # Insert reserved_extn_expr function
          newFunction='
/// DOGWOOD-SHARP-D3-IMPL-01-R5-R1 corrected-reference patch: recognize
/// Cedar'\''s reserved `__extn` escape as carried by the runtime value model and
/// return the corresponding extension-constructor expression.
///
/// The pinned value model has no ipaddr or datetime variant, so an `__extn`
/// record for those constructors previously degraded to a plain record here
/// and the typed value was lost at this boundary — the R5 typed-context root
/// cause. Cedar reserves the single-key `__extn` record unconditionally (with
/// or without schema direction; `CedarValueJson::ExtnEscape`), so recognizing
/// exactly that reserved shape here cannot misread a genuine record: a record
/// attribute literally named `__extn` with a different inner shape keeps the
/// pre-patch record behavior, exactly as Cedar'\''s own JSON parser treats it.
///
/// Only the single-argument `ip` and `datetime` constructors are modeled.
/// `decimal` already has a dedicated `Value` variant, so an explicit decimal
/// escape reaches this function only as a `Value::Decimal`, never as a raw
/// object. Every other function name keeps the pre-patch record behavior.
///
/// The constructor argument is deliberately not validated here:
/// `Context::from_pairs` evaluates the resulting restricted expression
/// eagerly, so an invalid argument fails closed at context build with the
/// Cedar evaluation error, matching the fail-closed behavior of Cedar'\''s own
/// schema-directed JSON authorization parsing.
fn reserved_extn_expr(map: &BTreeMap<String, Value>) -> Option<RestrictedExpression> {
    if map.len() != 1 { return None; }
    let fields = match map.get("__extn")? { Value::Object(fields) => fields, _ => return None };
    if fields.len() != 2 { return None; }
    let func = match fields.get("fn") { Some(Value::String(func)) => func.as_str(), _ => return None };
    let argument = match fields.get("arg") { Some(Value::String(argument)) => argument.as_str(), _ => return None };
    match func {
        "ip" => Some(RestrictedExpression::new_ip(argument)),
        "datetime" => Some(RestrictedExpression::new_datetime(argument)),
        _ => None,
    }
}

'
          newContent="${content:0:$byteOffset}$newFunction${content:$byteOffset}"

          # Find Value::Object arm in value_to_expr
          callMarker='Value::Object(map) => {'
          callLine=$(echo "$newContent" | awk -v m="$callMarker" 'index($0,m){print NR; exit}')
          if [ -z "$callLine" ] || [ "$callLine" = "0" ]; then echo "Could not find Value::Object arm in value_to_expr"; exit 1; fi

          callLineContent=$(echo "$newContent" | sed -n "${callLine}p")
          bracePos=$(echo "$callLineContent" | grep -ob "{" | head -1 | cut -d: -f1)
          if [ -z "$bracePos" ]; then echo "Could not find opening brace for Value::Object arm"; exit 1; fi

          braceByteOffset=$(echo "$newContent" | head -n $((callLine-1)) | wc -c)
          braceByteOffset=$((braceByteOffset + bracePos))

          insertCall='
// Corrected-reference patch: honor the reserved `__extn` escape
// before degrading the object to a plain record. See
// `reserved_extn_expr`.
if let Some(expr) = reserved_extn_expr(map) {
    return expr;
}
'

          finalContent="${newContent:0:$((braceByteOffset+1))}$insertCall${newContent:$((braceByteOffset+1))}"
          echo "$finalContent" > "$apiPath"
          echo "Manual patch applied successfully"

          # Verify
          content=$(cat "$apiPath")
          if ! echo "$content" | grep -q "fn reserved_extn_expr"; then echo "Patched api.rs missing reserved_extn_expr function"; exit 1; fi
          if ! echo "$content" | grep -q "reserved_extn_expr(map)"; then echo "Patched api.rs missing call to reserved_extn_expr in value_to_expr"; exit 1; fi
          echo "Patched api.rs verified: reserved_extn_expr function and call site present"
          echo "patched_root=$workDir" >> $GITHUB_OUTPUT

      - name: Build corrected reference oracle
        id: oracle
        shell: bash
        run: |
          patchedRoot="${{ steps.patch.outputs.patched_root }}"
          staging="r5r3-work/corrected-oracle"
          if [ -d "$staging" ]; then rm -rf "$staging"; fi
          mkdir -p "$staging/src"
          cp -r docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/src "$staging/"
          template=$(cat docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/Cargo.toml.template)
          manifest="${template/__DOGWOOD_PATCHED_PATH__/$(realpath "$patchedRoot/dogwood-language")}"
          echo "$manifest" > "$staging/Cargo.toml"
          cp docs/reviews/d3-impl-01-r5-r2/evidence/differential/corrected-oracle/Cargo.lock "$staging/"
          export CARGO_TARGET_DIR="r5r3-work/oracle-target"
          cargo build --locked --release --offline --manifest-path "$staging/Cargo.toml"
          suffix=""
          if [ "$OSTYPE" = "msys" ] || [ "$OSTYPE" = "cygwin" ]; then suffix=".exe"; fi
          oracleExe="r5r3-work/oracle-target/release/dogwoodsharp-corrected-oracle$suffix"
          if [ ! -f "$oracleExe" ]; then echo "Oracle executable not found at $oracleExe"; exit 1; fi
          oracleSha=$(sha256sum "$oracleExe" | cut -d' ' -f1)
          echo "Oracle built: $oracleExe (SHA256: $oracleSha)"
          echo "path=$oracleExe" >> $GITHUB_OUTPUT
          echo "sha256=$oracleSha" >> $GITHUB_OUTPUT

      - name: Build Cedar adjudicator (4.13.0)
        id: adjudicator
        shell: bash
        run: |
          staging="r5r3-work/cedar-adjudicator"
          if [ -d "$staging" ]; then rm -rf "$staging"; fi
          mkdir -p "$staging"
          cp -r docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/src "$staging/"
          cp docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/Cargo.toml "$staging/"
          cp docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/Cargo.lock "$staging/"
          export CARGO_TARGET_DIR="r5r3-work/adjudicator-target"
          cargo build --locked --release --offline --manifest-path "$staging/Cargo.toml"
          suffix=""
          if [ "$OSTYPE" = "msys" ] || [ "$OSTYPE" = "cygwin" ]; then suffix=".exe"; fi
          exe="r5r3-work/adjudicator-target/release/cedar-adjudicator$suffix"
          if [ ! -f "$exe" ]; then echo "Adjudicator not found at $exe"; exit 1; fi
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          echo "Cedar adjudicator built: $exe (SHA256: $sha)"
          echo "path=$exe" >> $GITHUB_OUTPUT
          echo "sha256=$sha" >> $GITHUB_OUTPUT

      - name: Build D2 bridge (native)
        id: bridge
        shell: bash
        run: |
          bridgeDir="native/dogwoodsharp-bridge"
          targetArg=""
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then targetArg="--target x86_64-unknown-linux-gnu"; fi
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then targetArg="--target aarch64-apple-darwin"; fi
          export CARGO_TARGET_DIR="r5r3-work/bridge-target"
          cargo build --locked --release $targetArg --manifest-path "$bridgeDir/Cargo.toml"
          libName=""
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then libName="libdogwoodsharp_bridge.so"; fi
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then libName="libdogwoodsharp_bridge.dylib"; fi
          if [ "${{ matrix.rid }}" = "win-x64" ]; then libName="dogwoodsharp_bridge.dll"; fi
          libPath="r5r3-work/bridge-target/${{ matrix.rid }}/release/$libName"
          if [ ! -f "$libPath" ]; then libPath="r5r3-work/bridge-target/release/$libName"; fi
          if [ ! -f "$libPath" ]; then echo "Bridge library not found at $libPath"; exit 1; fi
          sha=$(sha256sum "$libPath" | cut -d' ' -f1)
          echo "D2 bridge built: $libPath (SHA256: $sha)"
          echo "path=$libPath" >> $GITHUB_OUTPUT
          echo "sha256=$sha" >> $GITHUB_OUTPUT

      - name: Build CedarSharp native
        id: cedarsharp
        shell: bash
        run: |
          csDir="r5r3-work/cedar-sharp/native"
          if [ ! -d "$csDir" ]; then
            mkdir -p "$(dirname "$csDir")"
            git clone https://github.com/jenolaszlo-sketch/cedar-sharp.git "$csDir"
            if [ $? -ne 0 ]; then echo "Failed to clone CedarSharp repo"; exit 1; fi
          fi
          targetArg=""
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then targetArg="--target x86_64-unknown-linux-gnu"; fi
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then targetArg="--target aarch64-apple-darwin"; fi
          export CARGO_TARGET_DIR="r5r3-work/cedarsharp-target"
          cargo build --locked --release $targetArg --manifest-path "$csDir/Cargo.toml"
          libName=""
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then libName="libcedarsharp_native.so"; fi
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then libName="libcedarsharp_native.dylib"; fi
          if [ "${{ matrix.rid }}" = "win-x64" ]; then libName="cedarsharp_native.dll"; fi
          libPath="r5r3-work/cedarsharp-target/${{ matrix.rid }}/release/$libName"
          if [ ! -f "$libPath" ]; then libPath="r5r3-work/cedarsharp-target/release/$libName"; fi
          if [ ! -f "$libPath" ]; then echo "CedarSharp native not found at $libPath"; exit 1; fi
          sha=$(sha256sum "$libPath" | cut -d' ' -f1)
          echo "CedarSharp native built: $libPath (SHA256: $sha)"
          echo "path=$libPath" >> $GITHUB_OUTPUT
          echo "sha256=$sha" >> $GITHUB_OUTPUT

      - name: Stage native assets for probe
        shell: bash
        run: |
          rid="${{ matrix.rid }}"
          tfm="${{ matrix.tfm }}"
          probeRuntime="docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/$tfm/runtimes/$rid/native"
          mkdir -p "$probeRuntime"
          if [ -n "${{ steps.bridge.outputs.path }}" ]; then
            dest="$probeRuntime/$(if [ "$OSTYPE" = "msys" ] || [ "$OSTYPE" = "cygwin" ]; then echo "dogwoodsharp_bridge.dll"; else echo "libdogwoodsharp_bridge.so"; fi)"
            cp "${{ steps.bridge.outputs.path }}" "$dest"
            echo "Staged D2 bridge to $dest"
          fi
          if [ -n "${{ steps.cedarsharp.outputs.path }}" ]; then
            dest="$probeRuntime/$(if [ "$OSTYPE" = "msys" ] || [ "$OSTYPE" = "cygwin" ]; then echo "cedarsharp_native.dll"; else echo "libcedarsharp_native.so"; fi)"
            cp "${{ steps.cedarsharp.outputs.path }}" "$dest"
            echo "Staged CedarSharp native to $dest"
          fi
          bridgeSha="${{ steps.bridge.outputs.sha256 }}"
          csSha="${{ steps.cedarsharp.outputs.sha256 }}"
          cat > "$probeRuntime/dogwoodsharp-native.json" <<EOF
{
  "file": "$(if [ "$OSTYPE" = "msys" ] || [ "$OSTYPE" = "cygwin" ]; then echo "dogwoodsharp_bridge.dll"; else echo "libdogwoodsharp_bridge.so"; fi)",
  "sha256": "$bridgeSha",
  "cargoLockSha256": "$(sha256sum native/dogwoodsharp-bridge/Cargo.lock | cut -d' ' -f1)",
  "target": "$rid",
  "abiVersion": 1,
  "dogwoodVersion": "1.1.2",
  "dogwoodRevision": "${{ env.DOGWOOD_PINNED_REV }}",
  "cedarVersion": "4.11.0",
  "rustVersion": "1.99.1"
}
EOF
          if [ -n "$csSha" ]; then
            cat > "$probeRuntime/cedarsharp-native.json" <<EOF
{
  "file": "$(if [ "$OSTYPE" = "msys" ] || [ "$OSTYPE" = "cygwin" ]; then echo "cedarsharp_native.dll"; else echo "libcedarsharp_native.so"; fi)",
  "sha256": "$csSha",
  "target": "$rid"
}
EOF
          fi

      - name: Build probe
        shell: bash
        run: |
          probeProj="docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/R5R1Probe.csproj"
          dotnet restore "$probeProj" --locked-mode
          dotnet build "$probeProj" -c Release -f ${{ matrix.tfm }} --no-restore
          probeDll="docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/${{ matrix.tfm }}/PrepProbe.dll"
          if [ ! -f "$probeDll" ]; then echo "Probe not built at $probeDll"; exit 1; fi
          echo "Probe built: $probeDll"

      - name: Run differential (corrected reference)
        id: diff
        shell: bash
        run: |
          probe="docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/${{ matrix.tfm }}/PrepProbe.dll"
          oracle="${{ steps.oracle.outputs.path }}"
          fixtures="docs/reviews/d3-impl-01-r5-r2/evidence/fixtures.json"
          register="docs/reviews/d3-impl-01-r5-r2/evidence/register-corrected-reference.json"
          outDir="artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          mkdir -p "$outDir"
          obs="$outDir/observations-corrected-reference.json"
          life="$outDir/lifecycle-corrected-reference.json"
          scratch="r5r3-work/scratch-${{ matrix.rid }}-${{ matrix.tfm }}"
          dotnet "$probe" differential "$fixtures" "$oracle" "$register" "$obs" "$life" "$scratch" 2>&1 | tee "$outDir/console.log"
          exitCode=$?
          if [ $exitCode -ne 0 ]; then
            echo "Differential exited with code $exitCode"
            result=$(cat "$obs")
            echo "Summary: $(echo "$result" | jq -c '.summary')"
            echo "$result" | jq -r '.coverageErrors[]?' 2>/dev/null | while read err; do echo "Coverage error: $err"; done
            echo "$result" | jq -r '.cases[] | select(.verdict != "pass") | "FAIL: \(.id) class=\(.classification) fields=\(.observedDifferenceFields[].field)"' 2>/dev/null
            exit 1
          fi
          result=$(cat "$obs")
          echo "Differential passed: $(echo "$result" | jq '.summary.passed')/$(echo "$result" | jq '.summary.total') cases"
          echo "observations=$obs" >> $GITHUB_OUTPUT
          echo "lifecycle=$life" >> $GITHUB_OUTPUT

      - name: Run harness self-test
        shell: bash
        run: |
          probe="docs/reviews/d3-impl-01-r5-r2/evidence/differential/probe/bin/Release/${{ matrix.tfm }}/PrepProbe.dll"
          oracle="docs/reviews/d3-impl-01/evidence/differential/r4/upstream-oracle/target/release/dogwoodsharp-upstream-oracle.exe"
          if [ ! -f "$oracle" ]; then
            echo "Original oracle not available on non-Windows, skipping self-test"
            exit 0
          fi
          outDir="artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          selfTest="$outDir/self-test.json"
          dotnet "$probe" self-test "$oracle" "$selfTest" 2>&1 | tee "$outDir/self-test.log"
          if [ $? -ne 0 ]; then echo "Self-test failed"; exit 1; fi
          echo "Self-test passed"

      - name: Run Cedar adjudicator verification
        shell: bash
        run: |
          adj="${{ steps.adjudicator.outputs.path }}"
          corpus="docs/reviews/d3-impl-01-r5-r2/evidence/differential/cedar-adjudicator/corpus.json"
          outDir="artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          outcome="$outDir/adjudicator-outcome.json"
          "$adj" "$corpus" "$outcome"
          if [ $? -ne 0 ]; then echo "Cedar adjudicator failed"; exit 1; fi
          echo "Cedar adjudicator verification passed"

      - name: Upload differential evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r5r3-differential-${{ matrix.rid }}-${{ matrix.tfm }}
          path: |
            artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}/*.json
            artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}/*.log
          retention-days: 30

      - name: Verify differential results
        shell: bash
        run: |
          outDir="artifacts/r5r3-differential/${{ matrix.rid }}/${{ matrix.tfm }}"
          obs="$outDir/observations-corrected-reference.json"
          result=$(cat "$obs")
          echo "=== ${{ matrix.rid }} / ${{ matrix.tfm }} ==="
          echo "Total: $(echo "$result" | jq '.summary.total')"
          echo "Passed: $(echo "$result" | jq '.summary.passed')"
          echo "Failed: $(echo "$result" | jq '.summary.failed')"
          echo "Pending: $(echo "$result" | jq '.summary.pending')"
          failed=$(echo "$result" | jq '.summary.failed')
          if [ "$failed" -gt 0 ]; then
            echo "FAILURES:"
            echo "$result" | jq -r '.cases[] | select(.verdict != "pass") | "  \(.id): \(.classification) fields=\(.observedDifferenceFields[].field)"'
            exit 1
          fi
          coverageErrors=$(echo "$result" | jq -r '.coverageErrors[]?' 2>/dev/null)
          if [ -n "$coverageErrors" ]; then echo "Coverage errors: $coverageErrors"; exit 1; fi
          echo "ALL CASES PASSED on ${{ matrix.rid }}/${{ matrix.tfm }}"