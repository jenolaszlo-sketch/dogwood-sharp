name: DogwoodSharp producer verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.rid }} / net8.0 and net10.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.428
            10.0.404
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache: false
      - name: Verify native integration on both frameworks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $PSNativeCommandUseErrorActionPreference = $true
          & {
            Write-Output "Image: $env:ImageOS $env:ImageVersion"
            git rev-parse HEAD 'HEAD^{tree}'
            ./eng/Verify.ps1 -RuntimeIdentifier ${{ matrix.rid }}
          } *>&1 | Tee-Object -FilePath artifacts/verification.log
      - name: Check native buffer ownership with Valgrind
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          suite=$(cargo test --locked --release --manifest-path native/dogwoodsharp-bridge/Cargo.toml \
            --no-run --message-format=json | jq -er 'select(.profile.test == true and .executable != null) | .executable')
          valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect \
            --log-file=artifacts/memory-ownership.log "$suite" --exact tests::version_and_repeated_output_lifecycle
          valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect \
            --log-file=artifacts/d2-memory-ownership.log "$suite" --exact tests::d2_repeated_output_lifecycle
      - name: Audit managed dependencies
        run: dotnet list DogwoodSharp.slnx package --vulnerable --include-transitive
      - name: Prepare MSVC for the D1 consumer regression
        if: matrix.rid == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run version-aware D1 consumer regression
        shell: pwsh
        run: |
          Remove-Item Env:Platform -ErrorAction SilentlyContinue
          Remove-Item Env:Configuration -ErrorAction SilentlyContinue
          # AOT restore may add RID-specific sections to the tracked library lock.
          if (git status --porcelain -- src/DogwoodSharp/packages.lock.json) {
            git restore -- src/DogwoodSharp/packages.lock.json
          }
          ./eng/Verify-D1OnD2.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Valgrind:$IsLinux
      - name: Verify the archived D2 corpus and decoder controls against R2
        shell: pwsh
        run: ./eng/Verify-D2R2.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Measure supported resident native workloads
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          out=artifacts/d2-r2/resident
          mkdir -p "$out"
          cc -std=c11 -D_GNU_SOURCE -O2 -Wall -Wextra -Werror eng/d2-r2/resident.c -ldl -pthread -o "$out/probe"
          python3 eng/d2-r2/measure-resident.py "$out/probe" \
            artifacts/native/runtimes/linux-x64/native/libdogwoodsharp_bridge.so "$out" | tee "$out/measurement.log"
          LD_DEBUG=files dotnet samples/DogwoodSharp.FoundationSmoke/bin/Release/net10.0/DogwoodSharp.FoundationSmoke.dll \
            2>"$out/managed-loader-full.log"
          grep 'libdogwoodsharp_bridge\.so' "$out/managed-loader-full.log" >"$out/managed-loader.log"
          test "$(grep -c 'direct_opencount=1' "$out/managed-loader.log")" -eq 1
          test "$(grep -c 'opening file=' "$out/managed-loader.log")" -eq 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dogwoodsharp-d2-r2-${{ matrix.rid }}
          path: |
            artifacts/verification.log
            artifacts/memory-ownership.log
            artifacts/d2-memory-ownership.log
            artifacts/d2-r1-d1-regression/logs
            artifacts/d2-r1-d1-regression/reports
            artifacts/d2-r1-d1-regression/qualification-*.json
            artifacts/test-results/*.trx
            artifacts/native/runtimes
            artifacts/d2-r2/corpus/${{ matrix.rid }}/*.log
            artifacts/d2-r2/corpus/${{ matrix.rid }}/*.json
            artifacts/d2-r2/resident/*.log
            artifacts/d2-r2/resident/*.json
            artifacts/d2-r2/resident/*.stdout
