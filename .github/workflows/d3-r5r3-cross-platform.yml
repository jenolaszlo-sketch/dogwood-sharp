name: D3 R5-R3 Cross-Platform Differential Execution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform(s) to execute
        type: choice
        options: [all, linux-x64, osx-arm64]
        default: all
      tfm:
        description: Target framework(s)
        type: choice
        options: [all, net8.0, net10.0]
        default: all

permissions:
  contents: read

jobs:
  test:
    name: Test Workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Test
        run: echo "Workflow works!"